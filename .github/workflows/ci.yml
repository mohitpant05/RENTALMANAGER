name: CI

on:
  pull_request:
    branches: [main, prelive]
  push:
    branches: [main]
  workflow_call:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rentmanager
          POSTGRES_PASSWORD: rentmanager_test
          POSTGRES_DB: rentmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: test_master_key
          MEILI_ENV: development
        ports:
          - 7700:7700

    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin_test \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        working-directory: backend
        run: uv pip install --system ".[dev]"
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://rentmanager:rentmanager_test@localhost:5432/rentmanager_test"
          DATABASE_URL_SYNC: "postgresql://rentmanager:rentmanager_test@localhost:5432/rentmanager_test"
          REDIS_URL: "redis://localhost:6379/0"
          MEILI_URL: "http://localhost:7700"
          MEILI_MASTER_KEY: test_master_key
          MINIO_ENDPOINT: "localhost:9000"
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin_test
          SECRET_KEY: test-secret-key
        run: pytest --tb=short -q

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npx next lint
