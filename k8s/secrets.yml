apiVersion: v1
kind: Secret
metadata:
  name: rentmanager-secrets
  namespace: rentmanager
type: Opaque
stringData:
  POSTGRES_USER: rentmanager
  POSTGRES_PASSWORD: CHANGE_ME
  POSTGRES_DB: rentmanager
  DATABASE_URL: "postgresql+asyncpg://rentmanager:CHANGE_ME@postgres:5432/rentmanager"
  DATABASE_URL_SYNC: "postgresql://rentmanager:CHANGE_ME@postgres:5432/rentmanager"
  SECRET_KEY: CHANGE_ME
  MEILI_MASTER_KEY: CHANGE_ME
  MINIO_ROOT_USER: CHANGE_ME
  MINIO_ROOT_PASSWORD: CHANGE_ME
