# Manual migration job — use when init container migration is insufficient
# (e.g., running a one-off data migration or debugging).
# Usage: kubectl apply -f k8s/migration-job.yml
#        kubectl delete job alembic-migrate -n rentmanager  (cleanup after)
apiVersion: batch/v1
kind: Job
metadata:
  name: alembic-migrate
  namespace: rentmanager
spec:
  template:
    spec:
      containers:
        - name: migrate
          image: rentmanager-backend:latest
          command: ["alembic", "upgrade", "head"]
          env:
            - name: PYTHONPATH
              value: "/app"
          envFrom:
            - configMapRef:
                name: rentmanager-config
            - secretRef:
                name: rentmanager-secrets
      restartPolicy: Never
  backoffLimit: 3
